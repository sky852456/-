<!--
  GitHub Pages 等静态托管会把目录请求指向 index.html。
  这里直接跳到主应用，好处是 https://用户名.github.io/仓库名/ 这个短链也能用。
  用 replace 而非 href，避免在浏览器历史里留一条记录（返回键更自然）。
-->
<script>
  location.replace('./travel-planner.html' + (location.search || '') + (location.hash || ''));
</script>

  }

  .box img{width:76px;height:76px;border-radius:19px;box-shadow:0 4px 18px rgba(43,184,196,.22)}
